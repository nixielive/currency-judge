[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-judge"
version = "0.1.0"
description = "Reproducible USD/JPY direction experiments"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
currency-judge = "currency_judge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
